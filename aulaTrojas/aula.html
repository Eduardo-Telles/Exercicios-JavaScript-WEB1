<head>

</head>
<body>
    <button>Botao</button>
    <p>Hoje vou aprender html</p>
    <input type="password" placeholder="digite Aqui" value="TRojanadas">
    <script> 
        const botao=document.querySelector("button");
        botao.addEventListener("click",(e) => {

            console.log(input.value);
            console.log(input.getAttribute("type"));
            p.innerText=input.value;
            input.value="";
            input.type;
            input.name;

            input.getAttribute("type");
            input.setAttribute("class","azul center");
        });
    </script>
